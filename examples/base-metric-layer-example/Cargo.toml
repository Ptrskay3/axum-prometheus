[package]
name = "base-metric-layer-example"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustls = { version = "0.23", features = ["aws_lc_rs"] }
axum-prometheus = { path = "../../", features = ["push-gateway"] }
